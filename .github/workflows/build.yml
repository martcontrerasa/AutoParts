
name: Build

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  sonarqube:
    name: Tests and SonarQube
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      - name: Run Django checks
        run: python manage.py check

      - name: Apply database migrations
        run: python manage.py migrate --noinput

      - name: Start Django server
        run: |
          python manage.py runserver 127.0.0.1:8000 > django-server.log 2>&1 &
          for i in {1..30}; do
            if python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=2)" 2>/dev/null; then
              echo "Django server is ready"
              break
            fi
            sleep 2
          done
          python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"

      - name: Run tests with coverage
        run: |
          coverage run --source=api,frontend,AutoParts manage.py test test_autoparts -v 2
          coverage xml

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker-build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: sonarqube
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push AutoParts image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            martcontrerasa/autoparts:latest
            martcontrerasa/autoparts:${{ github.sha }}